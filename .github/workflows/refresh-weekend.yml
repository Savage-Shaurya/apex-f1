name: Race weekend results watch

# Makes results appear on their own: while a qualifying, sprint or race
# classification is due, /api/cron/weekend-watch reads it uncached from
# Jolpica F1, revalidates the pages that show it as soon as it is published or
# corrected, and stores race results in the database. Outside those windows a
# run is one cached calendar read. Sessions run Friday to Sunday (UTC); the
# race's correction watch reaches early Monday. Set repository variable
# APEX_SITE_URL to the HTTPS deployment origin and secret CRON_SECRET to its
# matching private cron token. GitHub schedules are best effort.

# Provider outages (cron resilience, 2026-10-31; DEPLOY.md "Cron outcomes"):
# scripts/invoke-cron.mjs retries a provider-unavailable report (HTTP 503,
# reason "provider-unavailable") and gateway errors up to three times over at
# most 8 minutes. If the provider is still down, the run ends green with a
# ::warning:: and a job-summary line while the route's last success is recent
# (48 h weather/weekend, 72 h season), and red once it is older. Any other
# failure (auth, configuration, our bug, invalid data) fails red at once.

on:
  schedule:
    - cron: "4 * * * 5,6,0" # hourly, Friday to Sunday UTC (owner, 2026-11-01)
    - cron: "4 0-6 * * 1" # hourly, Monday early hours (late races, corrections)
  workflow_dispatch: {}

concurrency:
  group: refresh-weekend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check due classifications and validate the report
        env:
          APEX_SITE_URL: ${{ vars.APEX_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/invoke-cron.mjs weekend-watch
