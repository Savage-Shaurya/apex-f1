name: Operations release integrity
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: operations-readiness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Verify package manager and frozen dependencies
        run: |
          test "$(pnpm --version)" = "10.33.0"
          pnpm install --frozen-lockfile
      - name: Exercise export boundaries and scheduler safety
        run: node --test scripts/ops/ops.test.mjs
      - name: Check reviewed scheduler sources
        run: node scripts/ops/release-preflight.mjs --source-only
      - name: Export clean source twice and verify exact identity
        run: |
          node scripts/ops/export-release.mjs "$RUNNER_TEMP/apex-release-a"
          node scripts/ops/export-release.mjs "$RUNNER_TEMP/apex-release-b"
          node "$RUNNER_TEMP/apex-release-a/scripts/ops/release-preflight.mjs" --source-only --manifest
          node -e 'const fs=require("node:fs"); const a=JSON.parse(fs.readFileSync(process.argv[1])); const b=JSON.parse(fs.readFileSync(process.argv[2])); if(a.digest!==b.digest)process.exit(1);' "$RUNNER_TEMP/apex-release-a/RELEASE-MANIFEST.json" "$RUNNER_TEMP/apex-release-b/RELEASE-MANIFEST.json"
      - name: Retain source manifest
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clean-release-source-manifest
          path: ${{ runner.temp }}/apex-release-a/RELEASE-MANIFEST.json
          if-no-files-found: error
          retention-days: 14
# No service/deployment credentials or mutation routes are used. This is source
# integrity evidence, not hosted execution or provider acceptance.
