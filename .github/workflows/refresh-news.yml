name: Refresh news cache

# Set repository variable APEX_SITE_URL to the intended HTTPS deployment origin
# and secret CRON_SECRET to its matching private cron token. GitHub schedules are
# best effort; inspect deployed source-health reports as well as run status.

# Provider outages (cron resilience, 2026-10-31; DEPLOY.md "Cron outcomes"):
# scripts/invoke-cron.mjs retries a provider-unavailable report (HTTP 503,
# reason "provider-unavailable") and gateway errors up to three times over at
# most 8 minutes. If the provider is still down, the run ends green with a
# ::warning:: and a job-summary line while the route's last success is under
# 48 h old, and red once it is older. Any other failure (auth, configuration,
# our bug, invalid data) fails red at once.

on:
  schedule:
    - cron: "2 * * * *" # hourly (public repo: no Actions minutes; owner, 2026-11-01)
  workflow_dispatch: {} # manual "Run workflow" button

concurrency:
  group: refresh-news
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Refresh news and validate its report
        env:
          APEX_SITE_URL: ${{ vars.APEX_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/invoke-cron.mjs rss-sync
