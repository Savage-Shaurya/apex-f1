name: Refresh videos

# Every two hours: refreshes the YouTube feed cache and stores new uploads
# (about 11 YouTube Data API quota units per run, well inside the daily 10,000).
# The daily hosting cron (04:00 UTC) remains. Set repository variable
# APEX_SITE_URL to the HTTPS deployment origin and secret CRON_SECRET to its
# matching private cron token.

on:
  schedule:
    - cron: "41 */2 * * *" # every two hours
  workflow_dispatch: {}

concurrency:
  group: refresh-videos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Refresh videos and validate the report
        env:
          APEX_SITE_URL: ${{ vars.APEX_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/invoke-cron.mjs youtube-sync
